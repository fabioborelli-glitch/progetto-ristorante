crons:
  - name: reservation-reminders
    description: "Invia alle 10:00 (ora italiana) il promemoria email ai clienti con prenotazione in giornata"
    cron: "0 10 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/reservation-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
